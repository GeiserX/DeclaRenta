name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. auto reads the commit prefixes since the last tag; patch, minor or major force that bump."
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout code
        # This job pushes the bump commit and the tag, so the credentials stay.
        uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # The main ruleset only accepts changes through a PR. This deploy key is its
          # one bypass, so the version bump commit below can land on main.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in the job that tags and publishes a release.
          package-manager-cache: false

      # No install scripts: this job holds a key that can push to main and tags.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release artifacts before tagging
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          test -f dist/cli.js
          node dist/cli.js --version
          npm pack --dry-run

      - name: Determine version bump
        id: version
        env:
          # Empty on push; set on a manual run. Read from env, never interpolated into the script.
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag -l "v*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Check commit messages since last tag for bump type.
          # COMMITS = subject lines (drives the no-bump exit + feat/fix detection).
          # BODIES  = full messages (subject + body) so a "BREAKING CHANGE:" footer
          #           in the body is detected, not only a "!" in the subject.
          COMMITS=$(git log "$LATEST"..HEAD --pretty=format:"%s" 2>/dev/null | grep -v "\[skip ci\]" || true)
          BODIES=$(git log "$LATEST"..HEAD --pretty=format:"%B" 2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "No meaningful commits since $LATEST — skipping release"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Breaking changes MUST win → test them FIRST. A breaking change is
          # either a "!" in a conventional subject (e.g. "feat!:", "fix(api)!:")
          # OR a "BREAKING CHANGE" / "BREAKING-CHANGE" token anywhere in a body.
          if echo "$COMMITS" | grep -qE "^(feat|fix|refactor|perf|chore)(\(.+\))?!:" \
            || echo "$BODIES" | grep -qE "BREAKING[ -]CHANGE"; then
            # Breaking change → major bump
            NEW_MAJOR=$((MAJOR + 1))
            NEW_TAG="v${NEW_MAJOR}.0.0"
          elif echo "$COMMITS" | grep -qiE "^feat(\(|:)"; then
            # feat: or feat(scope): → minor bump
            NEW_MINOR=$((MINOR + 1))
            NEW_TAG="v${MAJOR}.${NEW_MINOR}.0"
          else
            # fix/chore/docs/etc → patch bump
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          # A manual run can force the bump, e.g. to ship a batch of fixes as one minor release.
          case "$BUMP" in
            major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEW_TAG"

      - name: Sync package.json version and tag
        if: steps.version.outputs.new_tag != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          VERSION="${NEW_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: bump version to $VERSION [skip ci]"

            # Retry push with rebase to handle concurrent merges
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Generate changelog
        if: steps.version.outputs.new_tag != ''
        env:
          VERSION: ${{ steps.version.outputs.new_tag }}
          PREV_TAG: ${{ steps.version.outputs.latest }}
        run: |
          if [ "$PREV_TAG" = "v0.0.0" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          {
            echo "## What's Changed"
            echo ""

            FEATURES=$(git log $PREV_TAG..$VERSION --pretty=format:"- %s" --grep="^feat" 2>/dev/null || true)
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES" | head -20
              echo ""
            fi

            FIXES=$(git log $PREV_TAG..$VERSION --pretty=format:"- %s" --grep="^fix" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES" | head -20
              echo ""
            fi

            OTHERS=$(git log $PREV_TAG..$VERSION --pretty=format:"- %s" --invert-grep --grep="^feat" --invert-grep --grep="^fix" 2>/dev/null | head -10 || true)
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo ""
            fi

            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/$PREV_TAG...$VERSION"
          } > changelog.md

      - name: Create GitHub Release
        if: steps.version.outputs.new_tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    needs: release
    if: needs.release.outputs.new_tag != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.new_tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  notify:
    name: Telegram notification
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    # It only reads tags and the log; it never pushes.
    permissions:
      contents: read
    steps:
      - name: Checkout for changelog
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build message
        id: msg
        env:
          TAG: ${{ needs.release.outputs.new_tag }}
        run: |
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          COMMITS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"• %s" 2>/dev/null | grep -v "\[skip ci\]" | head -10)

          MSG=$(cat <<MSGEOF
          🚀 *DeclaRenta ${TAG}*

          ${COMMITS}

          [Ver release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) · [Usar online](https://declarenta.com)
          MSGEOF
          )

          # Escape for GitHub Actions
          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # The text holds commit subjects, so it reaches curl as data through env,
      # never pasted into the script where bash would run $( ) or backticks in it.
      - name: Send to Telegram
        env:
          TEXT: ${{ steps.msg.outputs.text }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${TEXT}"
