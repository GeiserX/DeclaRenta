name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  # No paths filter on pull requests: a docs-only PR must still run the strict
  # docs build below before it can reach a release.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Public fork PRs run arbitrary dependency scripts and test code. Keep this
    # validation on GitHub-hosted infrastructure, not private self-hosted runners.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: |
          npm run typecheck
          npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # The browser runs in the user's timezone, not UTC. Date-window code must
      # give the same result in Spain as on this UTC runner.
      - name: Test anti-churning windows in Madrid time
        run: npx vitest run tests/engine/wash-sale.test.ts
        env:
          TZ: Europe/Madrid

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      - name: Smoke test CLI package
        run: |
          test -f dist/cli.js
          node dist/cli.js --version
          npm pack --dry-run

  docker-headers:
    name: docker image headers
    # The Docker Hub image (Dockerfile.web) serves the app through nginx. Build
    # it, start it, and check that JS, CSS, sw.js and the HTML page all carry
    # the security headers from nginx-security-headers.conf.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f Dockerfile.web -t declarenta-web:ci .

      - name: Check security headers
        run: |
          docker run -d --name declarenta-web -p 127.0.0.1:8080:80 declarenta-web:ci
          scripts/check-docker-headers.sh http://127.0.0.1:8080

  docs:
    name: docs (strict)
    # The docs are built into the Pages artifact by deploy.yml at release time;
    # this job catches a broken link or an unreachable page before that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      - name: Build
        run: mkdocs build --strict

      # Material fetches the repo's stars and latest release from api.github.com
      # for every element marked data-md-component="source", which would send
      # each reader's IP to GitHub. overrides/partials/source.html keeps the
      # header link without that marker. The last two lines are controls: the
      # fetch code is still in the bundle, and the link still renders.
      - name: No GitHub API call from the docs pages
        run: |
          if grep -rl 'data-md-component="source"' site/; then
            echo "::error::The docs would call api.github.com from the reader's browser (see overrides/partials/source.html)"
            exit 1
          fi
          grep -rlq 'api.github.com' site/assets/javascripts/
          grep -q 'class="md-source"' site/index.html

  workflows:
    name: workflows (zizmor)
    # Static security audit of .github/workflows: fails on an expression pasted
    # into a run: script, an unpinned third-party action, or a checkout that keeps
    # the token when the job never pushes. Rules: .github/zizmor.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        run: pipx run --spec zizmor==1.30.1 zizmor --offline --config .github/zizmor.yml .github/workflows
