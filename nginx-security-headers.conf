# Security headers for every response. nginx drops server-level add_header
# lines in any location that sets its own add_header, so nginx.conf includes
# this file at server level AND in every location that adds a header.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://data-api.ecb.europa.eu; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
