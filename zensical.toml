# Generated from mkdocs.yml by mkdocs-to-zensical.py; the why of every block is in
# new-repo/templates/zensical.toml. Edit this file, not mkdocs.yml, which is gone.

[project]
site_name = "DeclaRenta"
# The docs are a directory of the product's Pages artifact, not a site of their
# own: deploy.yml builds them into dist/web/docs after `npm run build:web`, so
# they go live with each release (or a manual run of deploy.yml).
site_url = "https://declarenta.com/docs/"
site_dir = "dist/web/docs"
site_description = "Herramienta fiscal gratuita para inversores con brokers internacionales: lee los informes de tu broker extranjero y calcula las casillas de la renta con FIFO y tipos de cambio oficiales del BCE."
repo_url = "https://github.com/GeiserX/DeclaRenta"
repo_name = "GeiserX/DeclaRenta"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/theme.css"]
exclude_docs = """
[A-Z]*.md
design/
research/
notes/
requirements-docs.txt
# The social card source references logo.png in the app tree; it is not a site asset.
images/social.svg
"""
nav = [
  { Inicio = "index.md" },
  { "Primeros pasos" = [
      { "Primeros pasos" = "getting-started.md" },
      { Uso = "usage.md" },
      { "Brokers soportados" = "brokers.md" },
    ] },
  { Fiscalidad = [
      { "Modelos fiscales y motor fiscal" = "modelos-fiscales.md" },
      { "Casillas del Modelo 100" = "casillas.md" },
      { "Modelo 720, 721 y D-6" = "modelos-informativos.md" },
      { "Traza del motor de divisas (FX)" = "traza-fx.md" },
    ] },
  { Referencia = [
      { "Preguntas frecuentes" = "faq.md" },
      { "Solución de problemas" = "troubleshooting.md" },
      { Privacidad = "privacidad.md" },
    ] },
  { Desarrollo = "development.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "es"
variant = "modern"
# overrides/partials/source.html keeps the GitHub link in the header but
# stops the theme fetching repo facts from api.github.com in the reader's browser.
custom_dir = "overrides"
logo = "images/logo.svg"
favicon = "images/icon.svg"
# No Google Fonts: the product's privacy policy keeps every page on the
# system font stack.
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
  "toc.follow",
  "navigation.instant",
  "navigation.instant.progress",
  "content.action.copy",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo oscuro"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GeiserX/DeclaRenta"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/drumsergio/declarenta"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/declarenta"

[project.plugins.search]

[project.plugins.llmstxt.sections]
Documentation = ["*.md", "*/*.md"]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets".base_path = [".", "docs"]
"pymdownx.snippets".check_paths = true
"pymdownx.mark" = {}
attr_list = {}
md_in_html = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
tables = {}
toc.permalink = true
